<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo-vg.svg">
  <link rel="alternate" type="application/rss+xml" title="{{ settings.site_title }} RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  {% block top_bar %}{% endblock %}

  <header class="site-header">
    <div class="container navbar">
      {% include "partials/logo.html" %}

      <button
        type="button"
        id="mobile-menu-toggle"
        class="menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="nav-collapse"
      >
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M3 5h14M3 10h14M3 15h14" stroke-linecap="round"/>
        </svg>
      </button>

      <div id="nav-collapse" class="nav-collapse nav-right">
        <nav aria-label="Navegação principal">
          <ul class="nav-links">
            <li><a href="/" class="nav-link {% if active_nav == 'blog' %}is-active{% endif %}">Blog</a></li>
            <li><a href="/categoria/tecnologia" class="nav-link {% if active_nav == 'tecnologia' %}is-active{% endif %}">Tecnologia</a></li>
            <li><a href="/categoria/geek" class="nav-link {% if active_nav == 'geek' %}is-active{% endif %}">Geek</a></li>
            <li><a href="/categoria/off-topic" class="nav-link {% if active_nav == 'off-topic' %}is-active{% endif %}">Off-Topic</a></li>
            <li><a href="/sobre" class="nav-link {% if active_nav == 'sobre' %}is-active{% endif %}">Sobre</a></li>
          </ul>
        </nav>

        <form action="/buscar" method="get" class="search-form" role="search">
          <label for="navbar-search-input" class="sr-only">Pesquisar artigos</label>
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="9" cy="9" r="5.8"/>
            <path d="M13.5 13.5L17 17" stroke-linecap="round"/>
          </svg>
          <input
            id="navbar-search-input"
            class="search-input"
            type="search"
            name="q"
            value="{{ search_query }}"
            placeholder="Pesquisar..."
            autocomplete="off"
          >
          <span class="search-kbd" aria-hidden="true">/</span>
        </form>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-identity">
        <a href="/" class="footer-brand" aria-label="GreyWorks — Página inicial">
          <img src="/static/img/logo-vg.svg" alt="" width="28" height="28" class="footer-brand-icon">
          <span class="footer-wordmark"><span class="brand-grey">Grey</span><span class="brand-works">Works</span></span>
        </a>
        <span class="footer-copy">&copy; 2026 GreyWorks &bull; Vitor Grey.</span>
      </div>

      <nav class="footer-links" aria-label="Links do rodapé">
        <a href="/sobre">Sobre</a>
        <a href="/rss.xml">RSS</a>
        <a href="https://github.com/vitugrey" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.youtube.com/@vitugrey" target="_blank" rel="noopener noreferrer">YouTube</a>
      </nav>
    </div>
  </footer>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
