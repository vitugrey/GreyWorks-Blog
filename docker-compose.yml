services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greyworks_blog}
      POSTGRES_USER: ${POSTGRES_USER:-greyworks_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greyworks_app} -d ${POSTGRES_DB:-greyworks_blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SITE_TITLE: ${SITE_TITLE:-GreyWorks Blog}
      SITE_URL: https://${BLOG_DOMAIN:-localhost}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-Notas minimalistas sobre Tecnologia, cultura Geek e Off-Topic por Vitor Grey.}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-greyworks_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-greyworks_blog}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY com 32+ caracteres no arquivo .env}
      API_TOKEN: ${API_TOKEN:-}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${BLOG_DOMAIN:-localhost}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      BLOG_DOMAIN: ${BLOG_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
